name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Core pin check (vendor/wanderers-core matches wanderers-core.lock.json and the published release), syntax, lint, types, tests.
  # Pinned to a core release tag (not @main); keep it equal to the vendored core version. Dependabot proposes bumps.
  checks:
    uses: cocoomg11/wanderers-core/.github/workflows/module-checks.yml@v0.6.0
    with:
      types: true # JSDoc type check (npm run types); keep scripts/ JSDoc-clean
