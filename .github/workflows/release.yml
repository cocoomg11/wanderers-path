name: Release

on:
  release:
    types: [published]
  # Manual run: builds module.zip as a workflow artifact without touching any release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Release tags must be vMAJOR.MINOR.PATCH (v0.1.0, not 0.1 or v0.1): the version and download URL below come from the tag.
      - name: Check the release tag format
        if: github.event_name == 'release'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Bad release tag::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH (for example v0.1.0). Delete the release and tag, then publish again with a tag like v0.1.0."
            exit 1
          fi
          echo "Release tag $GITHUB_REF_NAME OK"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dev tools
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Tests and checks
        run: |
          npm run check
          npm run lint
          npm run types
          npm test

      # Core is imported at run time from vendor/wanderers-core/, so it must be exactly the pinned release (also against the published
      # release asset). A local pin passes with a warning: pin a published core version before releasing the module.
      - name: Vendored wanderers-core matches its pin
        run: node vendor/wanderers-core/vendor.mjs verify --remote

      - name: Set version and URLs in module.json
        if: github.event_name == 'release'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" --arg r "$REPO" --arg tag "$GITHUB_REF_NAME" '
            .version = $v
            | .url = "https://github.com/\($r)"
            | .manifest = "https://github.com/\($r)/releases/latest/download/module.json"
            | .download = "https://github.com/\($r)/releases/download/\($tag)/module.zip"
            | .bugs = "https://github.com/\($r)/issues"
          ' module.json > module.tmp && mv module.tmp module.json

      # The zip lists every top-level folder module.json refers to; core (vendor/) is imported at run time, so it ships too, minus the parts
      # Foundry never loads: core's config/ (shared lint and type configs) and its vendor.mjs tool. The folder in the repo stays complete
      # (the pin check above needs every file); only the zip is slimmed.
      - name: Build module.zip
        run: |
          zip -r module.zip module.json scripts styles lang vendor README.md CHANGELOG.md LICENSE \
            -x 'vendor/wanderers-core/config/*' 'vendor/wanderers-core/vendor.mjs'
          unzip -l module.zip

      - name: Upload release assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber

      - name: Keep module.zip as a workflow artifact (manual runs)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: module
          path: module.zip
